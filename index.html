<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Telefon Numarası Ayıklayıcı</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS CDN (Excel Okumak İçin) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 font-sans">

  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Başlık / Header -->
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-emerald-400">Excel Telefon Listesi (Akıllı Ayıklayıcı)</h1>
      <p class="text-slate-400 text-sm">Karışık form verilerinden isim ve telefon numaralarını otomatik ayıklar.</p>
    </div>

    <!-- Dosya Yükleme Alanı -->
    <div class="bg-slate-800 border-2 border-dashed border-slate-600 rounded-xl p-6 text-center hover:border-emerald-500 transition-colors cursor-pointer relative" id="drop-zone">
      <input type="file" id="excel-file" accept=".xlsx, .xls" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
      <div class="space-y-2 pointer-events-none">
        <svg class="w-10 h-10 mx-auto text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
        <p class="text-slate-200 font-medium">Excel dosyanızı buraya sürükleyin veya <span class="text-emerald-400 underline">seçin</span></p>
        <p class="text-xs text-slate-400">.XLSX veya .XLS formatı desteklenir</p>
      </div>
    </div>

    <!-- Arama ve Bilgi Barı (Varsayılan Gizli) -->
    <div id="controls" class="hidden flex-col sm:flex-row gap-4 items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
      <input type="text" id="search-input" placeholder="İsim veya numara ara..." class="w-full sm:w-72 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100" />
      <div class="text-xs text-slate-400 font-mono">
        Toplam Kayıt: <span id="total-count" class="text-emerald-400 font-bold">0</span>
      </div>
    </div>

    <!-- Numara Listesi -->
    <div id="phone-list" class="space-y-3">
      <!-- Dinamik olarak doldurulacak -->
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('excel-file');
    const phoneList = document.getElementById('phone-list');
    const controls = document.getElementById('controls');
    const searchInput = document.getElementById('search-input');
    const totalCountEl = document.getElementById('total-count');

    let parsedData = [];

    fileInput.addEventListener('change', handleFile);
    searchInput.addEventListener('input', filterList);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        // Tüm tabloyu ham dizi olarak al
        const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        
        processChaosData(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function processChaosData(rows) {
      parsedData = [];
      if (rows.length === 0) return;

      // 1. Satırdan itibaren tüm hücreleri tarayacağız (0. satır başlık)
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        // Formun ana sütunundaki genel ismi de yedek olarak alalım (örn: "Adınız Soyadınız" kolonu genelde 2. indistedir)
        let fallbackName = String(row[2] || '').trim();

        // Satırdaki tüm hücreleri incele (özellikle kalabalık form metin bloklarını içeren sütunları)
        row.forEach(cellVal => {
          let text = String(cellVal || '').trim();
          if (!text) return;

          // Metin içindeki telefon numarası kalıplarını yakala (örn: 05309757328, 0537 434 12 15, +90 543...)
          // Karmaşık metinlerde alt alta birden fazla kişi olabileceği için satırı bölerek veya regex ile arıyoruz.
          
          // Önce satırı olası kişi bloklarına ayıralım (bazen tire veya yeni satırla ayrılır)
          // Veya direkt regex ile metin bloğundan telefonları ve isimleri çekelim.
          
          // Daha akıllı yaklaşım: Metni satırlara veya anlamlı parçalara böl
          let chunks = text.split(/[\r\n]+/);
          chunks.forEach(chunk => {
            extractPersonAndPhone(chunk, fallbackName);
          });

          // Eğer chunk'lara bölünmediyse ama tek hücre içinde birden fazla veri varsa, 
          // genel bir telefon araması yapıp etrafındaki ismi yakalayalım.
          if (chunks.length <= 1) {
            extractPersonAndPhone(text, fallbackName);
          }
        });
      }

      // Benzersiz numaraları filtrele (Aynı kişi mükerrer eklenmesin)
      const uniqueMap = new Map();
      parsedData.forEach(item => {
        // Telefon numarasındaki tüm boşluk ve karakterleri temizleyip eşsiz anahtar yapalım
        let cleanKey = item.phone.replace(/\D/g, '');
        // Son 10 hanesini baz alalım ki başındaki 0 veya +90 farkı sorun yaratmasın
        if (cleanKey.length >= 10) {
          cleanKey = cleanKey.slice(-10);
        }
        if (!uniqueMap.has(cleanKey)) {
          uniqueMap.set(cleanKey, item);
        }
      });

      parsedData = Array.from(uniqueMap.values());

      controls.classList.remove('hidden');
      controls.classList.add('flex');
      renderList(parsedData);
    }

    function extractPersonAndPhone(text, fallbackName) {
      // Türkiye telefon formatı regex'i (05xx veya 5xx ile başlayan 10-11 haneli yapılar)
      // Boşluklu veya tireli hallerini de yakalar (örn: 0537 434 12 15)
      const phoneRegex = /(?:(?:\+|00)90|0)?\s*5\d{2}[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}/g;
      
      let match;
      while ((match = phoneRegex.exec(text)) !== null) {
        let phoneStr = match[0].trim();
        
        // Telefon numarasından önceki kısmı isim olarak tahmin etmeye çalışalım
        let index = match.index;
        let prefixText = text.substring(0, index).trim();
        
        // Öndeki metinden TC kimlik numarasını (11 haneli sayı) ve gereksiz kalıntıları temizle
        prefixText = prefixText.replace(/\b\d{11}\b/g, ''); // 11 haneli TC'leri sil
        prefixText = prefixText.replace(/[\/\-\,\.\:]/g, ' ').trim(); // Noktalama işaretlerini sil
        
        // Son kalan kelimeler genelde ad soyad ve yakınlık derecesidir (örn: "Ömer Faruk Öztürk Eşi")
        let words = prefixText.split(/\s+/).filter(w => w.length > 0);
        
        // Son kelime "Kendi", "Eşi", "Çocuk", "Anne" gibi yakınlık derecesiyse onu isimden ayıklayabiliriz
        let relationWords = ['kendi', 'kendisi', 'eşi', 'eş', 'çocuk', 'anne', 'baba', 'kardeş', 'kızım', 'oğlum', 'bebek', 'dost'];
        if (words.length > 0 && relationWords.includes(words[words.length - 1].toLowerCase())) {
          words.pop(); // Yakınlık kelimesini at
        }

        let nameStr = words.join(' ');
        
        // Eğer isim çok kısa veya boş kaldıysa satırın genel ismini (fallbackName) kullan
        if (!nameStr || nameStr.length < 2) {
          nameStr = fallbackName || 'İsimsiz Katılımcı';
        }

        // Listeye ekle
        parsedData.push({
          id: 'id_' + Math.random().toString(36).substr(2, 9),
          name: capitalCase(nameStr),
          phone: phoneStr,
          copied: false
        });
      }
    }

    function capitalCase(str) {
      return str.toLowerCase().replace(/(^|\s)\S/g, l => l.toUpperCase());
    }

    function renderList(items) {
      phoneList.innerHTML = '';
      totalCountEl.textContent = items.length;

      if (items.length === 0) {
        phoneList.innerHTML = `<div class="text-center py-8 text-slate-500">Geçerli telefon numarası bulunamadı.</div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = "flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-slate-600 transition-all";

        const btnBg = item.copied 
          ? "bg-rose-600 hover:bg-rose-700 text-white" 
          : "bg-emerald-600 hover:bg-emerald-500 text-white";
        const btnText = item.copied ? "Kopyalandı" : "Kopyala";

        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4">
            <span class="font-semibold text-slate-100 text-base">${escapeHtml(item.name)}</span>
            <span class="font-mono text-emerald-400 text-sm bg-slate-900/60 px-2.5 py-1 rounded-md border border-slate-700/50">${escapeHtml(item.phone)}</span>
          </div>
          <button onclick="copyPhone('${item.id}', '${escapeHtml(item.phone)}')" class="px-4 py-2 rounded-lg font-medium text-xs sm:text-sm transition-all transform active:scale-95 flex items-center gap-1.5 ${btnBg}">
            ${btnText}
          </button>
        `;
        phoneList.appendChild(card);
      });
    }

    function copyPhone(id, phone) {
      navigator.clipboard.writeText(phone).then(() => {
        const targetIndex = parsedData.findIndex(item => item.id === id);
        if (targetIndex !== -1) {
          parsedData[targetIndex].copied = true;
          filterList();
        }
      }).catch(err => {
        console.error('Kopyalama hatası:', err);
      });
    }

    function filterList() {
      const query = searchInput.value.toLowerCase();
      const filtered = parsedData.filter(item => 
        item.name.toLowerCase().includes(query) || 
        item.phone.toLowerCase().includes(query)
      );
      renderList(filtered);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
